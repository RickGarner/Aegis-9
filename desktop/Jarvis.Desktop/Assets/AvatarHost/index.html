<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarvis Avatar Host</title>
  <link rel="stylesheet" href="avatar-host.css" />
</head>
<body>
  <div class="ambient"></div>
  <main class="shell">
    <h1 id="name">JARVIS AVATAR</h1>
    <div class="state-row">
      <span id="stateBadge" class="state-badge state-ready">READY</span>
      <p id="state">Local avatar renderer host</p>
    </div>
    <p id="meta"></p>
    <model-viewer id="viewer" camera-controls autoplay disable-zoom interaction-prompt="none"></model-viewer>
    <section id="fallback" class="hidden">
      <h2>Model preview unavailable</h2>
      <p id="fallbackText"></p>
    </section>
    <p id="attribution"></p>
  </main>

  <script type="module" src="avatar-host.js"></script>
</body>
</html>
